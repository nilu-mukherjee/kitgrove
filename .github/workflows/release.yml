name: Release

# Publishes to npmjs.com (as `kitgrove`, via trusted publishing, no stored token) and to
# GitHub Packages (as `@nilu-mukherjee/kitgrove`) when a version tag such as v0.1.1 is pushed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag must match package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: npx tsc --noEmit
      - run: npm test

  npm:
    name: Publish to npmjs.com
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing: npm trusts this workflow's identity, no token is stored
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs a recent npm CLI (the one bundled with Node 22 is older).
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - name: Publish
        # No token. Configure the trusted publisher once on npmjs.com (package Settings):
        # user nilu-mukherjee, repository kitgrove, workflow release.yml.
        # Build provenance is attached automatically when the repository is public.
        run: npm publish --access public --ignore-scripts

  github-packages:
    name: Publish to GitHub Packages
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@nilu-mukherjee"
      - run: npm ci
      - run: npm run build
      - name: Use the scoped name GitHub Packages requires
        run: npm pkg set name=@nilu-mukherjee/kitgrove publishConfig.registry=https://npm.pkg.github.com
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --ignore-scripts
